spring:
  application:
    name: garage-backend
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/garage_db}
    username: ${DB_USERNAME:garage_app}
    password: ${DB_PASSWORD:karmakaze69}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update  # This will create/update tables from your entity classes
    show-sql: true      # Set to true to see SQL being executed
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: false  # Disable Flyway so Hibernate can manage schema
    baseline-on-migrate: true
    clean-disabled: false
    locations: classpath:db/migration
  
  security:
    jwt:
      secret: ${JWT_SECRET:200d09752aeb0498a006435ca65ee3ffb7121f4e4f7b53ff491507d195400f6f}
      expiration: ${JWT_EXPIRATION:86400000}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:karmanyasingh8@gmail.com}
    password: ${GMAIL_APP_PASSWORD:yjplyzzogvuyuuhv}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          timeout: 5000
          connectiontimeout: 5000

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}  # Listen on all interfaces to allow access via IP
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api/v1}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
  mvc:
    throw-exception-if-no-handler-found: true
    static-path-pattern: /static/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

logging:
  level:
    com.garage.backend: ${LOGGING_LEVEL:DEBUG}
    org.springframework.security: ${LOGGING_LEVEL:DEBUG}
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: ${LOGGING_LEVEL:DEBUG}
    org.springframework.web: ${LOGGING_LEVEL:DEBUG}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %-5level - %logger{36} - %msg%n"

aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:}

# Application Base URL Configuration
app:
  base-url: ${APP_BASE_URL:http://192.168.1.5:8080/api/v1} 